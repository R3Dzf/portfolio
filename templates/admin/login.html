{% extends "base.html" %}
{% block title %}Admin Login — {{ settings.name if settings else 'Ahmed Bosha' }}{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">
        <!-- Logo & Header -->
        <div class="auth-card__header">
            <div class="auth-card__icon-wrap">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h1 class="auth-card__title">
                {{ settings.name if settings and settings.name else 'Ahmed Bosha' }}
            </h1>
            <p class="auth-card__subtitle">Portfolio CMS Administration</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('admin_login') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Username
                </label>
                <input class="form-input" type="text" id="username" name="username"
                       placeholder="Enter admin username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Password
                </label>
                <div style="position: relative;">
                    <input class="form-input" type="password" id="password" name="password"
                           placeholder="Enter admin password" required autocomplete="current-password"
                           style="padding-right: 42px;">
                    <button type="button" id="togglePassBtn" aria-label="Toggle password visibility"
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--clr-text-muted); cursor: pointer; padding: 0;">
                        <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg" style="margin-top: 1.5rem; justify-content: center;">
                ⚡ Log In to Dashboard
            </button>

            <div class="auth-card__footer">
                <a href="{{ url_for('index') }}" class="auth-card__back">
                    &larr; Back to Public Portfolio
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('togglePassBtn').addEventListener('click', function() {
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        passInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
});
</script>
{% endblock %}
