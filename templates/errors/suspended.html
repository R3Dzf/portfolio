{% extends "base.html" %}
{% block title %}Account Suspended — Portfolio Unavailable{% endblock %}

{% block body %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center;">
    <div style="max-width: 480px; background: var(--clr-surface); border: 1px solid var(--clr-border); border-top: 4px solid #e74c3c; border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.4);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🛑</div>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--clr-text); margin-bottom: 0.75rem;">Portfolio Suspended</h1>
        <p style="color: var(--clr-text-muted); font-size: 0.98rem; line-height: 1.7; margin-bottom: 1.5rem;">
            The portfolio for <strong>@{{ username }}</strong> is currently suspended by the platform administration.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn--outline">
            ← Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
